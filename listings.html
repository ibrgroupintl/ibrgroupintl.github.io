<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commercial Listings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    body { background: #181c24; color: #f5f6fa; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; }
    .container { max-width: 1100px; margin: 40px auto; background: #23283a; border-radius: 18px; box-shadow: 0 4px 32px rgba(0,0,0,0.18); padding: 32px 40px; }
    .title { font-size: 2.1rem; font-weight: 700; margin-bottom: 24px; }
    .listings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; }
    .listing-card { background: #20243a; border-radius: 14px; padding: 24px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.10); display: flex; flex-direction: column; gap: 12px; }
    .listing-address { font-size: 1.1rem; font-weight: 600; }
    .listing-type { color: #3a8dde; font-size: 1rem; }
    .listing-status { color: #aaa; font-size: 0.98rem; }
    .listing-desc { color: #e0e6f7; font-size: 0.98rem; }
    @media (max-width: 700px) { .container { padding: 16px 4vw; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">Active Commercial Listings</div>
    <div class="listings-grid" id="listingsGrid">
      <div>Loading...</div>
    </div>
  </div>
  <script>
    // Wait for Firebase Auth and Firestore to load
    function waitForFirebase(cb) {
      if (window.firebase && firebase.firestore) cb();
      else setTimeout(() => waitForFirebase(cb), 100);
    }
    function renderListings(listings) {
      const grid = document.getElementById('listingsGrid');
      if (!listings.length) { grid.innerHTML = '<div>No active listings.</div>'; return; }
      grid.innerHTML = listings.map(l => `
        <div class="listing-card">
          <div class="listing-address">${l.address}</div>
          <div class="listing-type">${l.type}</div>
          <div class="listing-status">${l.status}</div>
          <div class="listing-desc">${l.description||''}</div>
        </div>
      `).join('');
    }
    waitForFirebase(function() {
      firebase.initializeApp(window.firebaseConfig);
      const db = firebase.firestore();
      db.collection('listings').where('status','==','Active').onSnapshot(snap => {
        const listings = [];
        snap.forEach(doc => listings.push(doc.data()));
        renderListings(listings);
      });
    });
  </script>
</body>
</html>
