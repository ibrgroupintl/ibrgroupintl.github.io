<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brokerage Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <style>
        body {
            background: #181c24;
            color: #f5f6fa;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 40px auto;
            background: #23283a;
            border-radius: 18px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.18);
            padding: 32px 40px 40px 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dashboard-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3a8dde 0%, #1e4e79 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
        }
        .user-name {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 32px;
        }
        .dashboard-card {
            background: #20243a;
            border-radius: 14px;
            padding: 24px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.10);
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 220px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card-content {
            flex: 1;
        }
        .list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .list li {
            padding: 8px 0;
            border-bottom: 1px solid #2d3147;
        }
        .list li:last-child {
            border-bottom: none;
        }
        .action-btn {
            background: linear-gradient(90deg, #3a8dde 0%, #1e4e79 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: linear-gradient(90deg, #1e4e79 0%, #3a8dde 100%);
        }
        .footer {
            display: flex;
            justify-content: flex-end;
            gap: 18px;
            margin-top: 24px;
        }
        .footer-icon {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #3a8dde;
            background: #23283a;
            border-radius: 50%;
            transition: background 0.2s;
            text-decoration: none;
        }
        .footer-icon:hover {
            background: #3a8dde;
            color: #fff;
        }
        @media (max-width: 700px) {
            .dashboard-container {
                padding: 16px 4vw;
            }
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div class="dashboard-title">Brokerage Dashboard</div>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">JD</div>
                <div class="user-name" id="userName">John Doe</div>
            </div>
        </div>
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-title">Active Listings</div>
                <div class="card-content">
                    <ul class="list" id="listingsList">
                        <li>Loading...</li>
                    </ul>
                </div>
                <button class="action-btn" onclick="addListing()">Add Listing</button>
            </div>
            <div class="dashboard-card">
                <div class="card-title">Leads & Contacts</div>
                <div class="card-content">
                    <ul class="list" id="leadsList">
                        <li>Loading...</li>
                    </ul>
                </div>
                <button class="action-btn" onclick="addLead()">Add Lead</button>
            </div>
            <div class="dashboard-card">
                <div class="card-title">Tasks & Reminders</div>
                <div class="card-content">
                    <ul class="list" id="tasksList">
                        <li>Loading...</li>
                    </ul>
                </div>
                <button class="action-btn" onclick="addTask()">Add Task</button>
            </div>
            <div class="dashboard-card">
                <div class="card-title">Market Insights</div>
                <div class="card-content" id="insightsContent">
                    Loading...
                </div>
                <button class="action-btn" onclick="refreshInsights()">Refresh</button>
            </div>
        </div>
        <div class="footer">
            <a href="https://www.linkedin.com/" class="footer-icon" title="LinkedIn" target="_blank" rel="noopener">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.761 0 5-2.239 5-5v-14c0-2.761-2.239-5-5-5zm-11 19h-3v-10h3v10zm-1.5-11.268c-.966 0-1.75-.784-1.75-1.75s.784-1.75 1.75-1.75 1.75.784 1.75 1.75-.784 1.75-1.75 1.75zm15.5 11.268h-3v-5.604c0-1.337-.025-3.063-1.868-3.063-1.868 0-2.154 1.459-2.154 2.968v5.699h-3v-10h2.881v1.367h.041c.401-.761 1.379-1.563 2.841-1.563 3.039 0 3.6 2.001 3.6 4.601v5.595z"/></svg>
            </a>
            <a href="https://twitter.com/" class="footer-icon" title="Twitter" target="_blank" rel="noopener">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M24 4.557a9.93 9.93 0 0 1-2.828.775 4.932 4.932 0 0 0 2.165-2.724c-.951.564-2.005.974-3.127 1.195a4.92 4.92 0 0 0-8.384 4.482c-4.086-.205-7.713-2.164-10.141-5.144a4.822 4.822 0 0 0-.666 2.475c0 1.708.87 3.216 2.188 4.099a4.904 4.904 0 0 1-2.229-.616c-.054 2.281 1.581 4.415 3.949 4.89a4.936 4.936 0 0 1-2.224.084c.627 1.956 2.444 3.377 4.6 3.417a9.867 9.867 0 0 1-6.102 2.104c-.396 0-.787-.023-1.175-.069a13.945 13.945 0 0 0 7.548 2.212c9.057 0 14.009-7.513 14.009-14.009 0-.213-.005-.425-.014-.636a10.012 10.012 0 0 0 2.457-2.548z"/></svg>
            </a>
            <a href="mailto:info@brokerage.com" class="footer-icon" title="Email">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 13.065l-11.99-7.065v14h24v-14l-12.01 7.065zm11.99-9.065h-23.98l11.99 7.065 11.99-7.065z"/></svg>
            </a>
        </div>
    </div>
    <script>
        // Demo data for dashboard
        const listings = [
            { address: "123 Main St, Suite 400", type: "Office", status: "Active" },
            { address: "456 Commerce Ave", type: "Retail", status: "Active" },
            { address: "789 Industrial Rd", type: "Warehouse", status: "Active" }
        ];
        const leads = [
            { name: "Acme Corp", contact: "acme@example.com" },
            { name: "Beta Holdings", contact: "beta@example.com" }
        ];
        const tasks = [
            { task: "Call Acme Corp rep", due: "Today" },
            { task: "Schedule property tour", due: "Tomorrow" }
        ];
        const insights = [
            "ESG: Green building certifications up 12% YoY.",
            "Energy: Commercial rates stable, slight uptick in renewables.",
            "Real Estate: Vacancy rates at 5-year low in downtown markets."
        ];

        function renderListings() {
            const el = document.getElementById('listingsList');
            el.innerHTML = listings.map(l => `<li><strong>${l.address}</strong> <span style='color:#3a8dde;'>[${l.type}]</span> <span style='float:right;'>${l.status}</span></li>`).join('');
        }
        function renderLeads() {
            const el = document.getElementById('leadsList');
            el.innerHTML = leads.map(l => `<li><strong>${l.name}</strong> <span style='color:#aaa;'>${l.contact}</span></li>`).join('');
        }
        function renderTasks() {
            const el = document.getElementById('tasksList');
            el.innerHTML = tasks.map(t => `<li>${t.task} <span style='float:right;color:#3a8dde;'>${t.due}</span></li>`).join('');
        }
        function renderInsights() {
            const el = document.getElementById('insightsContent');
            el.innerHTML = `<ul class='list'>${insights.map(i => `<li>${i}</li>`).join('')}</ul>`;
        }
        function addListing() {
            const address = prompt('Enter property address:');
            if (address) {
                listings.push({ address, type: "Office", status: "Active" });
                renderListings();
            }
        }
        function addLead() {
            const name = prompt('Enter lead name:');
            const contact = prompt('Enter contact email:');
            if (name && contact) {
                leads.push({ name, contact });
                renderLeads();
            }
        }
        function addTask() {
            const task = prompt('Enter task:');
            const due = prompt('Due date:');
            if (task && due) {
                tasks.push({ task, due });
                renderTasks();
            }
        }
        function refreshInsights() {
            // In real app, fetch from API/Firestore
            renderInsights();
        }
        // Initial render
        renderListings();
        renderLeads();
        renderTasks();
        renderInsights();
    </script>
</body>
</html>
