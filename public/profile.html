<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="description" content="Public profile">
  <title>Public Profile — Impact in Business Recruitment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --card:#ffffff; --line:#dbe3ee; --text:#0f172a; --muted:#475569; --accent:#092a4b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Open Sans',Arial,sans-serif; color:var(--text); background:linear-gradient(180deg,#f5f9ff 0%,#ffffff 100%); }
    .wrap { max-width:860px; margin:2rem auto; padding:0 1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 28px rgba(2,6,23,.08); overflow:hidden; }
    .head { padding:1.2rem; background:linear-gradient(125deg,#0d4ea4,#22c1f1); color:#fff; }
    .body { padding:1.2rem; }
    .avatar { width:128px; height:128px; border-radius:14px; object-fit:cover; border:1px solid #dbe3ee; background:#f8fafc; }
    h1 { margin:.8rem 0 .45rem; color:#092a4b; font-size:1.8rem; }
    .bio { margin:.6rem 0 0; color:#1f2937; font-size:11px; line-height:1.55; white-space:pre-wrap; }
    .social { margin-top:1rem; }
    .social a { color:#0b61a4; text-decoration:none; font-weight:600; }
    .empty { color:var(--muted); }
    .footer { margin-top:1rem; color:var(--muted); font-size:.85rem; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <article class="card">
      <div class="head">Impact in Business Recruitment — Public Profile</div>
      <div class="body">
        <img id="profileImage" class="avatar" src="/160.jpg" alt="Public profile image">
        <h1 id="profileName">Profile</h1>
        <p id="profileBio" class="bio empty">This profile is not available.</p>
        <p id="profileSocial" class="social"></p>
      </div>
    </article>
    <p class="footer">&copy; 2026 Impact in Business Recruitment</p>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script defer src="/firebase-config.js"></script>
  <script>
    window.addEventListener('load', async function () {
      if (!window.firebase || !window.firebaseConfig) return;
      try { firebase.initializeApp(window.firebaseConfig); } catch (e) {}
      const db = firebase.firestore();

      const imageEl = document.getElementById('profileImage');
      const nameEl = document.getElementById('profileName');
      const bioEl = document.getElementById('profileBio');
      const socialEl = document.getElementById('profileSocial');

      const pathPart = (window.location.pathname.split('/').pop() || '').replace(/\.html$/i, '');
      const queryId = new URLSearchParams(window.location.search).get('id') || '';
      const userId = String(queryId || pathPart || '').trim().toUpperCase();

      if (!userId) {
        nameEl.textContent = 'Profile not found';
        bioEl.textContent = 'Missing profile identifier.';
        return;
      }

      try {
        const snap = await db.collection('publicProfiles').where('userId', '==', userId).where('isPublic', '==', true).limit(1).get();
        if (snap.empty) {
          nameEl.textContent = 'Profile not found';
          bioEl.textContent = 'No public profile exists for this User ID.';
          return;
        }

        const data = snap.docs[0].data() || {};
        const firstName = String(data.firstName || '').trim().slice(0, 50);
        const lastName = String(data.lastName || '').trim().slice(0, 50);
        const fullName = (firstName + ' ' + lastName).trim() || 'Profile';
        const bio = String(data.bio || '').trim().slice(0, 1000);
        const socialUrl = String(data.socialUrl || '').trim();
        const socialLabel = String(data.socialLabel || 'Social profile').trim().slice(0, 40);
        const imageDataUrl = String(data.imageDataUrl || '').trim();

        nameEl.textContent = fullName;
        bioEl.textContent = bio || 'No bio provided.';
        bioEl.classList.toggle('empty', !bio);

        document.title = fullName + ' — Impact in Business Recruitment';
        const meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute('content', fullName + ' public profile');

        if (imageDataUrl) imageEl.src = imageDataUrl;

        if (socialUrl) {
          try {
            const u = new URL(socialUrl);
            if (u.protocol === 'http:' || u.protocol === 'https:') {
              socialEl.innerHTML = '<a href="' + socialUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener noreferrer">' + (socialLabel || 'Social profile') + '</a>';
            }
          } catch (err) {}
        }
      } catch (err) {
        console.error('Public profile load failed', err);
        nameEl.textContent = 'Profile unavailable';
        bioEl.textContent = 'Unable to load profile right now.';
      }
    });
  </script>
</body>
</html>
