<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="description" content="Public profile">
  <title>Public Profile — Impact in Business Recruitment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --card:#ffffff; --line:#dbe3ee; --text:#0f172a; --muted:#475569; --accent:#092a4b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Open Sans',Arial,sans-serif; color:var(--text); background:linear-gradient(180deg,#f5f9ff 0%,#ffffff 100%); }
    .topbar { max-width:860px; margin:1rem auto 0; padding:0 1rem; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
    .auth-pill { display:inline-flex; align-items:center; gap:8px; padding:.45rem .75rem; border:1px solid #dbe3ee; border-radius:999px; background:#fff; color:var(--muted); font-size:.9rem; }
    .auth-pill strong { color:#092a4b; }
    .auth-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .wrap { max-width:860px; margin:1rem auto 2rem; padding:0 1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 28px rgba(2,6,23,.08); overflow:hidden; }
    .head { padding:1.2rem; background:linear-gradient(125deg,#0d4ea4,#22c1f1); color:#fff; }
    .body { padding:1.2rem; }
    .avatar { width:128px; height:128px; border-radius:14px; object-fit:cover; border:1px solid #dbe3ee; background:#f8fafc; }
    h1 { margin:.8rem 0 .45rem; color:#092a4b; font-size:1.8rem; }
    .bio { margin:.6rem 0 0; color:#1f2937; font-size:11px; line-height:1.55; white-space:pre-wrap; }
    .social { margin-top:1rem; }
    .social a { color:#0b61a4; text-decoration:none; font-weight:600; }
    .empty { color:var(--muted); }
    .footer { margin-top:1rem; color:var(--muted); font-size:.85rem; text-align:center; }
    .hint { margin-top:.5rem; color:var(--muted); font-size:.9rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <div id="authStatus" class="auth-pill">Loading account status...</div>
    <div class="auth-actions">
      <a id="authActionLink" class="btn btn-outline" href="/login.html">Sign In</a>
    </div>
  </div>

  <div class="wrap">
    <article class="card">
      <div class="head">Impact in Business Recruitment — Member Profile</div>
      <div class="body">
        <img id="profileImage" class="avatar" src="/100.png" alt="Profile image">
        <h1 id="profileName">Profile</h1>
        <p id="profileBio" class="bio empty">This profile is not available.</p>
        <p id="profileSocial" class="social"></p>
        <p id="profileHint" class="hint"></p>
      </div>
    </article>
    <p class="footer">&copy; 2026 Impact in Business Recruitment</p>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script defer src="/firebase-config.js"></script>
  <script>
    window.addEventListener('load', async function () {
      if (!window.firebase || !window.firebaseConfig) return;
      try { firebase.initializeApp(window.firebaseConfig); } catch (e) {}
      const db = firebase.firestore();
      const auth = firebase.auth();

      const imageEl = document.getElementById('profileImage');
      const nameEl = document.getElementById('profileName');
      const bioEl = document.getElementById('profileBio');
      const socialEl = document.getElementById('profileSocial');
      const hintEl = document.getElementById('profileHint');
      const authStatusEl = document.getElementById('authStatus');
      const authActionLink = document.getElementById('authActionLink');

      const pathPart = (window.location.pathname.split('/').pop() || '').replace(/\.html$/i, '');
      const queryId = new URLSearchParams(window.location.search).get('id') || '';
      const userId = String(queryId || pathPart || '').trim().toUpperCase();

      function setAuthState(user) {
        if (!authStatusEl || !authActionLink) return;
        if (user) {
          const name = user.displayName || user.email || 'Member';
          authStatusEl.innerHTML = 'Signed in as <strong>' + name.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</strong>';
          authActionLink.textContent = 'Sign Out';
          authActionLink.href = '#';
          authActionLink.onclick = function (e) {
            e.preventDefault();
            auth.signOut().then(function () { window.location.reload(); });
          };
        } else {
          authStatusEl.textContent = 'Signed out';
          authActionLink.textContent = 'Sign In';
          authActionLink.href = '/login.html';
          authActionLink.onclick = null;
        }
      }

      function showSignInRequired() {
        window.location.replace('/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search));
      }

      async function loadProfile() {
        if (!userId) {
          nameEl.textContent = 'Profile not found';
          bioEl.textContent = 'Missing profile identifier.';
          hintEl.textContent = 'Use /public/<userId>.html';
          return;
        }

        hintEl.textContent = 'Looking up ' + userId + '...';

        try {
          let data = null;
          const directSnap = await db.collection('publicProfilesByUserId').doc(userId).get();
          if (directSnap.exists) {
            const directData = directSnap.data() || {};
            data = directData;
          }

          if (!data) {
            const snap = await db.collection('publicProfiles').where('userId', '==', userId).limit(1).get();
            if (!snap.empty) data = snap.docs[0].data() || {};
          }

          if (!data) {
            nameEl.textContent = 'Profile not found';
            bioEl.textContent = 'No profile exists for this User ID.';
            hintEl.textContent = 'If you just saved the profile, refresh once more or save again.';
            return;
          }

          const firstName = String(data.firstName || '').trim().slice(0, 50);
          const lastName = String(data.lastName || '').trim().slice(0, 50);
          const fullName = (firstName + ' ' + lastName).trim() || 'Profile';
          const bio = String(data.bio || '').trim().slice(0, 1000);
          const socialUrl = String(data.socialUrl || '').trim();
          const socialLabel = String(data.socialLabel || 'Social profile').trim().slice(0, 40);
          const imageDataUrl = String(data.imageDataUrl || '').trim();

          nameEl.textContent = fullName;
          bioEl.textContent = bio || 'No bio provided.';
          bioEl.classList.toggle('empty', !bio);
          hintEl.textContent = 'User ID: ' + userId;

          document.title = fullName + ' — Impact in Business Recruitment';
          const meta = document.querySelector('meta[name="description"]');
          if (meta) meta.setAttribute('content', fullName + ' public profile');

          imageEl.src = imageDataUrl || '/100.png';

          if (socialUrl) {
            try {
              const u = new URL(socialUrl);
              if (u.protocol === 'http:' || u.protocol === 'https:') {
                socialEl.innerHTML = '<a href="' + socialUrl.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener noreferrer">' + (socialLabel || 'Social profile') + '</a>';
              }
            } catch (err) {}
          }
        } catch (err) {
          console.error('Public profile load failed', err);
          nameEl.textContent = 'Profile unavailable';
          bioEl.textContent = 'Unable to load profile right now.';
        }
      }

      auth.onAuthStateChanged(async function (user) {
        setAuthState(user || null);
        if (!user) {
          showSignInRequired();
          return;
        }
        await loadProfile();
      });
    });
  </script>
</body>
</html>
