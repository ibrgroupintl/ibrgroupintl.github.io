<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Secure Login</title>
  <link rel="stylesheet" href="/index.css">
  <style>
    /* Minimal, neutral login card styling */
    body{display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:var(--rc-bg)}
    .card{width:380px;background:var(--rc-surface);border-radius:12px;padding:28px;box-shadow:var(--rc-shadow);border:1px solid var(--rc-border)}
    h1{font-size:1.25rem;margin:0 0 8px}
    p.lead{color:var(--rc-text-dim);margin:0 0 18px}
    .actions{display:flex;flex-direction:column;gap:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
    .btn-primary{background:var(--rc-accent);color:#fff}
    .btn-outline{background:transparent;border:1px solid var(--rc-border);color:var(--rc-text-dim)}
    .note{font-size:0.85rem;color:var(--rc-text-dim);text-align:center}
    #error{color:#b00020;font-size:0.95rem;display:none;margin-top:8px}
  </style>
  <!-- Firebase compat SDKs (loaded from CDN) -->
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script defer src="/firebase-config.js"></script>
</head>
<body>
  <div class="card" role="main" aria-labelledby="signin-title">
    <h1 id="signin-title">Secure Login</h1>
    <p class="lead">Sign in with your Google account to access the protected portal.</p>

    <div id="error" role="alert"></div>

    <div class="actions">
      <button id="googleBtn" class="btn btn-primary" type="button">Sign in with Google</button>
      <a class="btn btn-outline" href="/index.html">Return to public site</a>
    </div>

    <p class="note">This site uses Firebase Authentication (Google). Your sign-in will be handled by Google and Firebase.</p>
  </div>

  <script>
    // Initialize Firebase and set up auth flows
    (function(){
      try {
        firebase.initializeApp(window.firebaseConfig);
      } catch (e) {
        // firebase app already initialized or missing config
      }

      const auth = firebase.auth();
      const googleBtn = document.getElementById('googleBtn');
      const errEl = document.getElementById('error');

      function showError(msg){ errEl.textContent = msg; errEl.style.display = 'block'; }

      // Handle redirect result (if signInWithRedirect was used)
      auth.getRedirectResult().then((result) => {
        if (result && result.user) {
          // Signed in via redirect
          window.location.replace('/resource-centre.html');
        }
      }).catch((err) => {
        console.error('Redirect result error', err);
        showError(err.message || 'Authentication error');
      });

      // If already signed in, go to resource centre
      auth.onAuthStateChanged(user => {
        if (user) window.location.replace('/resource-centre.html');
      });

      async function signInWithGoogle(){
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          // Try popup first
          await auth.signInWithPopup(provider);
        } catch (err) {
          console.warn('Popup failed, falling back to redirect', err);
          // Popup blocked or unsupported - fallback to redirect
          try {
            await auth.signInWithRedirect(provider);
          } catch (rerr) {
            console.error('Redirect fallback failed', rerr);
            showError(rerr.message || 'Authentication failed');
          }
        }
      }

      googleBtn.addEventListener('click', () => { errEl.style.display='none'; signInWithGoogle(); });

    })();
  </script>
  <script src="/index.js" defer></script>
</body>
</html>
