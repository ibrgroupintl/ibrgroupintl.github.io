<!-- public/login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Enterprise Login — Human Resource Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f6f8;--card:#ffffff;--muted:#6b7280;--accent:#0f62fe;--danger:#b00020;--border:#e6eef8}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:#0f1724;display:flex;align-items:center;justify-content:center;padding:24px}
    .login-wrapper{max-width:420px;width:100%}
    .login-card{background:var(--card);padding:28px;border-radius:12px;border:1px solid var(--border);box-shadow:0 8px 30px rgba(2,6,23,0.06);text-align:center}
    h1{margin:0;font-size:1.3rem}
    p.lead{color:var(--muted);margin-top:8px;margin-bottom:18px}
    .actions{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-google{background:#db4437;color:#fff}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .form-row{display:flex;flex-direction:column;gap:10px;margin-top:8px;text-align:left}
    input[type="email"],input[type="password"]{width:100%;padding:10px 12px;border:1px solid #dbe7ff;border-radius:8px;background:#fcfeff}
    .footer-note{margin-top:14px;font-size:0.88rem;color:var(--muted)}
    .error{color:var(--danger);font-size:0.95rem;margin-top:6px;text-align:left}
    .brand{font-weight:700;color:var(--accent);margin-bottom:8px}
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="/firebase-config.js"></script>
</head>
<body>
  <main class="login-wrapper" role="main">
    <section class="login-card" aria-labelledby="login-heading">
      <div class="brand" aria-hidden="true">Impact in Business Recruitment</div>
      <h1 id="login-heading">Enterprise Login</h1>
      <p class="lead">Secure portal gateway for the Human Resources Centre</p>

      <div id="error" class="error" role="alert" style="display:none"></div>

      <div class="actions">
        <button id="googleSignIn" class="btn btn-google" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 533.5 544.3" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M533.5 278.4c0-18.5-1.5-37.1-4.7-55.3H272v104.8h146.9c-6.4 34.7-26.1 64.1-55.7 83.7v69.4h90c52.9-48.7 83.3-120.6 83.3-202.6z"/>
            <path fill="#34A853" d="M272 544.3c74.4 0 136.9-24.6 182.6-66.7l-90-69.4c-25 16.8-57 26.8-92.6 26.8-71 0-131.1-48-152.6-112.5h-95.5v70.8C86.6 487.2 173.9 544.3 272 544.3z"/>
            <path fill="#FBBC05" d="M119.4 323.6c-10.8-32.3-10.8-66.8 0-99.1V153.7h-95.5C6.1 205.6 0 239.5 0 272.5s6.1 66.9 23.9 118.9l95.5-68z"/>
            <path fill="#EA4335" d="M272 107.7c39.3 0 74.6 13.6 102.5 40.6l76.9-76.9C408.9 24.6 346.4 0 272 0 173.9 0 86.6 57.1 43.8 141.6l95.5 70.8C140.9 155.7 201 107.7 272 107.7z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>

        <div style="text-align:center;color:var(--muted);font-size:0.9rem">or</div>

        <div class="form-row">
          <input id="email" type="email" placeholder="Email" autocomplete="email">
          <input id="password" type="password" placeholder="Password" autocomplete="current-password">
          <button id="emailSignIn" class="btn btn-primary">Sign in</button>
        </div>

        <a class="btn btn-outline" href="/">Return to site</a>
      </div>

      <div class="footer-note">By signing in you agree to our terms and privacy policy.</div>
    </section>
  </main>

  <script>
    // Initialize Firebase
    try {
      firebase.initializeApp(window.firebaseConfig);
    } catch (err) {
      console.error('Firebase init error', err);
      document.getElementById('error').textContent = 'Configuration error. Contact administrator.';
      document.getElementById('error').style.display = 'block';
    }

    const auth = firebase.auth();

    // If already signed in, redirect to resource centre
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.replace('/resource-centre.html');
      }
    });

    // Google Sign-in
    document.getElementById('googleSignIn').addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
        // onAuthStateChanged handles redirect
      } catch (err) {
        console.error(err);
        const el = document.getElementById('error');
        el.textContent = err.message || 'Authentication error';
        el.style.display = 'block';
      }
    });

    // Email/password sign-in (if enabled in Firebase Console)
    document.getElementById('emailSignIn').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const el = document.getElementById('error');
      el.style.display = 'none';
      if (!email || !password) {
        el.textContent = 'Please enter email and password.';
        el.style.display = 'block';
        return;
      }
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        console.error(err);
        el.textContent = err.message || 'Authentication failed';
        el.style.display = 'block';
      }
    });
  </script>
</body>
</html>
