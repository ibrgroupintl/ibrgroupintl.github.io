type User @table {
  email: String!
  passwordHash: String!
  createdAt: Timestamp!
  isActive: Boolean!
  isEmailConfirmed: Boolean!
  firstName: String
  lastName: String
  lastLoginAt: Timestamp
  emailConfirmationToken: String
}

type PasswordResetToken @table {
  token: String!
  user: User!
  expiresAt: Timestamp!
  createdAt: Timestamp!
  usedAt: Timestamp
}

type Session @table {
  sessionToken: String!
  user: User!
  expiresAt: Timestamp!
  createdAt: Timestamp!
  ipAddress: String
  userAgent: String
}

type Role @table {
  name: String!
  createdAt: Timestamp!
  description: String
}

type UserRole @table(key: ["user", "role"]) {
  user: User!
  role: Role!
  assignedAt: Timestamp!
}