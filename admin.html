<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Manage Listings</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script defer src="firebase-config.js"></script>
  <style>
    body { background: #181c24; color: #f5f6fa; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; }
    .admin-container { max-width: 900px; margin: 40px auto; background: #23283a; border-radius: 18px; box-shadow: 0 4px 32px rgba(0,0,0,0.18); padding: 32px 40px; }
    .admin-title { font-size: 2rem; font-weight: 700; margin-bottom: 24px; }
    .listings-table { width: 100%; border-collapse: collapse; margin-bottom: 32px; }
    .listings-table th, .listings-table td { padding: 10px 8px; border-bottom: 1px solid #2d3147; }
    .listings-table th { color: #3a8dde; text-align: left; font-size: 1rem; }
    .listings-table td { font-size: 0.98rem; }
    .admin-form { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .admin-form input, .admin-form select { background: #20243a; color: #f5f6fa; border: 1px solid #2d3147; border-radius: 6px; padding: 8px 10px; font-size: 1rem; }
    .admin-form button { background: linear-gradient(90deg, #3a8dde 0%, #1e4e79 100%); color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .admin-form button:hover { background: linear-gradient(90deg, #1e4e79 0%, #3a8dde 100%); }
    .side-menu { position: fixed; left: 0; top: 0; height: 100vh; width: 180px; background: #20243a; display: flex; flex-direction: column; align-items: center; padding-top: 40px; box-shadow: 2px 0 16px rgba(0,0,0,0.12); }
    .side-menu a { color: #f5f6fa; text-decoration: none; font-size: 1.1rem; margin: 18px 0; padding: 8px 18px; border-radius: 6px; transition: background 0.2s; width: 100%; text-align: left; }
    .side-menu a.active, .side-menu a:hover { background: #3a8dde; color: #fff; }
    .side-menu .menu-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 32px; color: #3a8dde; }
    .main-content { margin-left: 200px; }
    @media (max-width: 900px) { .main-content { margin-left: 0; } .side-menu { position: static; width: 100%; flex-direction: row; height: auto; box-shadow: none; padding: 0; } .side-menu a { margin: 0 8px; } }
  </style>
</head>
<body>
  <div class="side-menu">
    <div class="menu-title">Admin Panel</div>
    <a href="admin.html" class="active">Listings</a>
    <button id="signOutBtn" style="background:none;border:none;color:#f5f6fa;font-size:1rem;cursor:pointer;margin:18px 0 0 0;padding:8px 18px;width:100%;text-align:left;">Sign Out</button>
  </div>
  <div class="main-content">
    <section id="loginSection" class="admin-container" style="display:none;text-align:center">
      <h1 style="color:#3a8dde">Admin Area</h1>
      <p style="color:#b0b8d1">Sign in to access the admin panel.</p>
      <a class="admin-form button" href="/login.html" style="background:#3a8dde;color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;">Go to Sign In</a>
    </section>
    <div id="adminShell" class="admin-container" style="display:none">
      <div class="admin-title">Manage Commercial Listings</div>
      <form class="admin-form" id="listingForm">
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="type" placeholder="Type (e.g. Office)" required>
        <input type="text" id="status" placeholder="Status (Active/Inactive)" required>
        <input type="text" id="description" placeholder="Description">
        <button type="submit">Add Listing</button>
      </form>
      <table class="listings-table" id="listingsTable">
        <thead>
          <tr><th>Address</th><th>Type</th><th>Status</th><th>Description</th><th>Delete</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script>
    // Wait for Firebase and Auth
    window.addEventListener('load', function () {
      function showSignedOut() {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminShell').style.display = 'none';
        document.getElementById('signOutBtn').style.display = 'none';
      }
      function showSignedIn(user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminShell').style.display = 'block';
        document.getElementById('signOutBtn').style.display = 'inline-flex';
      }
      function waitForFirebase(cb) {
        if (window.firebase && window.firebaseConfig) cb();
        else setTimeout(() => waitForFirebase(cb), 100);
      }
      waitForFirebase(function() {
        try { firebase.initializeApp(window.firebaseConfig); } catch (e) {}
        const auth = firebase.auth();
        const signOutBtn = document.getElementById('signOutBtn');
        auth.onAuthStateChanged(function(user) {
          if (!user) {
            showSignedOut();
            return;
          }
          showSignedIn(user);
          // Firestore logic only after auth
          if (!window._adminFirestoreLoaded) {
            window._adminFirestoreLoaded = true;
            loadAdminFirestore();
          }
        });
        if (signOutBtn) signOutBtn.addEventListener('click', function () { auth.signOut(); });
      });
      function loadAdminFirestore() {
        // Wait for Firestore
        function waitForFirestore(cb) {
          if (firebase.firestore) cb();
          else setTimeout(() => waitForFirestore(cb), 100);
        }
        waitForFirestore(function() {
          const db = firebase.firestore();
          function renderTable(listings) {
            const tbody = document.querySelector('#listingsTable tbody');
            tbody.innerHTML = listings.map(l => `<tr><td>${l.address}</td><td>${l.type}</td><td>${l.status}</td><td>${l.description||''}</td><td><button onclick=\"deleteListing('${l.id}')\">Delete</button></td></tr>`).join('');
          }
          window.deleteListing = function(id) {
            if (!confirm('Delete this listing?')) return;
            db.collection('listings').doc(id).delete();
          };
          db.collection('listings').onSnapshot(snap => {
            const listings = [];
            snap.forEach(doc => listings.push({id: doc.id, ...doc.data()}));
            renderTable(listings);
          });
          document.getElementById('listingForm').onsubmit = function(e) {
            e.preventDefault();
            const address = document.getElementById('address').value.trim();
            const type = document.getElementById('type').value.trim();
            const status = document.getElementById('status').value.trim();
            const description = document.getElementById('description').value.trim();
            if (!address || !type || !status) return alert('Address, Type, and Status required');
            db.collection('listings').add({address, type, status, description});
            this.reset();
          };
        });
      }
    });
  </script>
</body>
</html>
